<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Superação • Protótipo visual</title><style>
:root{--bg:#F5F8F5;--surface:#fff;--surface-alt:#EAF3EF;--primary:#125F55;--ink:#152A29;--secondary:#5B7170;--outline:#C9DBD3;--accent:#D9F277;--success:#246747;--danger:#B13D39;--shadow:0 24px 78px #092f2920;--radius:20px}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:#E4EEE8;font-size:16px;line-height:1.4}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8ACCBC;outline-offset:2px}.canvas{min-height:100vh;display:grid;grid-template-columns:minmax(230px,300px) auto;align-items:center;justify-content:center;gap:52px;padding:34px;background:radial-gradient(circle at 10% 10%,#F4F9EA,transparent 46%),radial-gradient(circle at 92% 72%,#D9EDDF,transparent 47%),#E4EEE8}.editorial{align-self:center;max-width:290px}.kicker{font-size:11px;font-weight:850;letter-spacing:2px;text-transform:uppercase;color:#48746B}.brandname{font-size:49px;line-height:1.05;font-weight:850;letter-spacing:-2px;margin:15px 0}.lead{font-size:16px;color:#526B67;line-height:1.55}.caption{font-size:12px;color:#618077;line-height:1.5}.pages{display:grid;gap:5px;margin-top:30px}.pages button{background:transparent;border:0;text-align:left;padding:11px 13px;border-radius:12px;font-size:13px;color:#42635E;font-weight:680}.pages button.sel{background:#125F55;color:white}.frame{width:400px;height:846px;border:7px solid #182F2C;border-radius:50px;background:var(--bg);box-shadow:0 30px 70px #14483b25;position:relative;overflow:hidden;flex:none}.camera{position:absolute;width:100px;height:17px;background:#182F2C;top:0;left:calc(50% - 50px);border-radius:0 0 18px 18px;z-index:20}.app{height:100%;position:relative;overflow:auto;scrollbar-width:none;background:var(--bg)}.app::-webkit-scrollbar{display:none}.statusline{height:35px;padding:12px 27px 0;display:flex;align-items:center;justify-content:space-between;color:var(--ink);font-size:10px;font-weight:750}.content{padding:14px 23px 102px;min-height:690px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 22px}.titlebar{font-size:23px;font-weight:790;letter-spacing:-.7px;margin:0}.sub{font-size:12px;color:var(--secondary);font-weight:590}.avatar{height:43px;width:43px;background:var(--surface-alt);color:var(--primary);border:1px solid #D6E8DF;border-radius:15px;display:grid;place-items:center;font-weight:750;flex:none}.synchint{font-size:11px;font-weight:700;display:inline-flex;gap:6px;align-items:center;color:var(--secondary)}.dot{height:7px;width:7px;background:#E8A947;border-radius:100%;display:inline-block}.eyebrow{font-size:11px;font-weight:850;letter-spacing:1.3px;color:#5E8075;text-transform:uppercase}.hero{background:linear-gradient(142deg,#0C554C,#17776C 66%,#23816B);color:#fff;padding:22px;border-radius:25px;position:relative;overflow:hidden;box-shadow:0 14px 23px #125f552a;margin:15px 0 20px}.hero:after{content:'';position:absolute;right:-53px;top:-54px;width:230px;height:230px;border:37px solid #ffffff10;border-radius:90px;transform:rotate(30deg);pointer-events:none}.hero h2{position:relative;font-size:28px;line-height:1.1;letter-spacing:-1.1px;margin:10px 0 10px;max-width:265px;font-weight:820}.hero p{position:relative;font-size:13px;color:#D4EBE2;max-width:265px;margin:0 0 20px}.hero .eyebrow{color:#C4E6D8}.primary,.accentbtn{min-height:53px;padding:12px 18px;border:0;border-radius:15px;background:var(--primary);color:white;font-weight:760;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:9px}.primary.block,.accentbtn.block{width:100%}.accentbtn{background:var(--accent);color:#203826;box-shadow:0 3px 0 #a8cc51}.hero .accentbtn{position:relative;z-index:2}.secondarybtn{background:#E7F0EA;border:1px solid #DAE9DF;color:var(--primary);min-height:48px;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:760}.tinybtn{border:1px solid var(--outline);border-radius:13px;background:white;padding:10px 12px;font-size:12px;color:var(--primary);font-weight:790;min-height:44px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.sectionhead h3{font-size:18px;letter-spacing:-.35px;margin:0}.linkbtn{border:0;background:none;color:var(--primary);font-size:13px;font-weight:780;padding:9px 0}.card{background:var(--surface);border-radius:var(--radius);padding:17px;border:1px solid #ECF0EB;box-shadow:0 3px 10px #294b310a;margin-bottom:11px}.cardtitle{font-size:16px;font-weight:790;letter-spacing:-.25px}.muted{font-size:13px;color:var(--secondary)}.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:760;background:#E3EEE7;color:#315B4D}.pill.warn{background:#FFF1D6;color:#885A17}.pill.lime{background:#EDF8B8;color:#466018}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.start{align-items:flex-start}.metricgroup{display:flex;gap:10px;margin:14px 0}.metric{background:#EDF3EE;border-radius:15px;padding:13px 11px;flex:1;min-width:0}.metric .num{font-size:22px;font-weight:830;letter-spacing:-.7px}.metric .lab{font-size:10px;color:#5D746C;font-weight:700}.progressrail{height:9px;background:#DCE9DE;border-radius:999px;overflow:hidden;margin:13px 0 6px}.progressrail i{display:block;background:#2D9076;width:66%;height:100%;border-radius:999px}.daystrip{display:flex;justify-content:space-between;gap:5px;margin:13px 0 12px}.day{width:40px;padding:9px 0;background:#fff;border:1px solid #E7EEE9;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:6px;flex-direction:column;font-size:12px;font-weight:760}.day small{font-size:10px;color:var(--secondary)}.day.active{background:#135F55;color:#fff}.day.active small{color:#E1EEE7}.day.rest{background:#EBF3EB}.nav{height:78px;position:sticky;bottom:0;background:#ffffffF5;border-top:1px solid #E0EBE2;display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px;backdrop-filter:blur(8px);z-index:5}.nav button{border:0;background:transparent;min-width:67px;min-height:55px;display:grid;place-items:center;align-content:center;gap:2px;color:#6E857C;font-size:10px;font-weight:800}.nav button.active{color:#125F55}.nav .ico{font-size:21px;line-height:23px}.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:4px 0 13px}.chips button{white-space:nowrap;padding:10px 12px;border:1px solid var(--outline);background:white;border-radius:999px;font-size:12px;font-weight:740;color:#506C60}.chips button.active{background:#125F55;color:white}.search{width:100%;border:1px solid #DAE7DF;background:white;border-radius:15px;min-height:52px;padding:12px 16px;margin:0 0 14px;color:var(--ink)}.exercise{display:flex;gap:13px;align-items:center}.thumb{width:66px;height:66px;border-radius:16px;background:linear-gradient(135deg,#DAF2E5,#E5F4D1);color:#2A7362;display:grid;place-items:center;flex:none;font-size:26px;font-weight:820}.thumb.blue{background:linear-gradient(135deg,#DCEDE7,#DFE8F7)}.thumb.sand{background:linear-gradient(135deg,#F0EDD7,#F7F4E6)}.arrow{font-size:23px;color:#A6B9B0}.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #EEF1ED}.numtag{height:32px;width:32px;background:#EDF6EA;border-radius:11px;color:#48795B;font-weight:820;display:grid;place-items:center}.item:last-child{border:0}.sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.sets span{background:#EBF4EF;color:#315B4B;padding:7px 9px;font-size:11px;font-weight:760;border-radius:10px}.builderadd{border:2px dashed #BCDAD0;border-radius:18px;text-align:center;padding:18px;margin:14px 0;background:#F7FAF7;color:var(--primary);font-weight:750}.focus .topbar{margin-bottom:12px}.focus .content{padding-bottom:30px}.illustration{height:192px;border-radius:24px;background:radial-gradient(circle at 55% 65%,#B4E1C8,#DDEDE3 55%,#EEF7E9 85%);display:grid;place-items:center;position:relative;overflow:hidden;margin:17px 0}.illustration svg{width:145px;height:145px;opacity:.88}.setcount{font-size:59px;font-weight:830;letter-spacing:-2px;text-align:center;line-height:1.15;margin:10px 0 0}.setcount span{color:#88AAA0}.buttonrow{display:flex;gap:10px}.buttonrow>*{flex:1}.card.sync{border:1px solid #D8E8DE;background:#EEF6EF}.bars{height:150px;display:flex;gap:15px;align-items:end;justify-content:center;margin:16px 0 8px}.bar{width:35px;border-radius:11px 11px 4px 4px;background:#94D0B7}.bar.hi{background:#125F55}.bar small{position:absolute;margin-top:7px;bottom:auto}.rule{border-bottom:1px solid #E7ECE7;margin:15px 0}.sheetOverlay{position:absolute;inset:0;background:#05140A70;display:flex;align-items:flex-end;z-index:11}.sheet{width:100%;background:white;border-radius:27px 27px 0 0;padding:24px 23px 29px;box-shadow:0 -10px 50px #0c302b30}.sheet h2{margin:8px 0 8px;letter-spacing:-.6px}.stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin:25px 0}.stepper button{width:54px;height:54px;border:1px solid #CCDDD3;background:#F2F7F3;border-radius:17px;font-size:24px;color:var(--primary)}.stepper strong{font-size:36px;min-width:65px;text-align:center;font-variant-numeric:tabular-nums}.statebox{background:#EAF4EC;border-radius:17px;padding:15px;margin:15px 0;font-size:13px;color:#2B5F4D}.sidecontrols{display:flex;gap:10px;margin-top:20px}.sidecontrols button{border:1px solid #CCE1D6;background:white;border-radius:12px;font-size:12px;padding:9px 10px;font-weight:760;color:#235E53}.smallcard{background:#EAF3EF;padding:13px;border-radius:15px}.screenfoot{color:#6E837A;font-size:11px;text-align:center;margin:22px 0 7px}.toast{position:absolute;top:44px;left:24px;right:24px;background:#143F36;color:#fff;padding:12px 16px;border-radius:15px;font-size:12px;box-shadow:0 7px 24px #092c2b30;z-index:14;text-align:center}.editorial .swatchrow{display:flex;gap:8px;margin:16px 0}.swatch{height:24px;width:38px;border-radius:8px;border:1px solid #183b3018}
@media(max-width:720px){body{background:var(--bg)}.canvas{display:block;padding:0;background:var(--bg)}.editorial{display:none}.frame{width:100%;height:100dvh;border:none;border-radius:0;box-shadow:none}.camera{display:none}.statusline{height:25px;padding:7px 23px 0}.content{min-height:calc(100dvh - 105px);padding-bottom:85px}}
@media(prefers-reduced-motion:no-preference){button{transition:background-color .16s,color .16s}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body><div class="canvas"><aside class="editorial"><div class="kicker">Design kit · v4 · 2026</div><div class="brandname">supere<br>no seu<br><span style="color:#187266">ritmo.</span></div><p class="lead">Superação<br>Um app para construir o hábito, treinar com clareza e acompanhar cada conquista.</p><div class="swatchrow"><span class="swatch" style="background:#125F55"></span><span class="swatch" style="background:#D9F277"></span><span class="swatch" style="background:#F5F8F5"></span><span class="swatch" style="background:#152A29"></span></div><p class="caption">Protótipo visual navegável. Dados simulados. Sem Firebase, conta real ou prescrição profissional. Referência para implementar React/PWA no Google AI Studio.</p><div class="pages" id="pages"></div><div class="sidecontrols"><button onclick="cycleSync()">Alternar sync</button><button onclick="setView('rest')">Descanso</button></div></aside><div class="frame"><div class="camera"></div><div id="app" class="app"></div></div></div><script>
// DESIGN PROTOTYPE ONLY — NO AUTH, FIRESTORE, MEDICAL PRESCRIPTION OR REAL TRAINING LOG.
const views=[['home','01 · Início'],['workouts','02 · Treinos'],['explore','03 · Catálogo'],['builder','04 · Montador'],['active','05 · Execução'],['calendar','06 · Agenda'],['progress','07 · Progresso'],['profile','08 · Perfil'],['rest','09 · Descanso']];
const state={view:new URLSearchParams(location.search).get('view')||'home',sync:0,reps:8,modal:false,completed:0,filter:'Todos',rest:false};
const syncText=['Salvo neste aparelho','Aguardando sincronização','Sincronizado'][state.sync];
function h(c,t){return `<div class="sectionhead"><h3>${c}</h3>${t?`<button class="linkbtn" onclick="setView('${t[1]}')">${t[0]} →</button>`:''}</div>`}
function nav(){return `<nav class="nav" aria-label="Navegação principal">${[['home','⌂','Início'],['workouts','▤','Treinos'],['calendar','▦','Agenda'],['progress','↗','Progresso']].map(([id,icon,label])=>`<button class="${state.view===id?'active':''}" onclick="setView('${id}')"><span class="ico">${icon}</span>${label}</button>`).join('')}</nav>`}
function topBar(title,subtitle){return `<div class="topbar"><div><h1 class="titlebar">${title}</h1>${subtitle?`<div class="sub">${subtitle}</div>`:''}</div><button class="avatar" aria-label="Perfil" onclick="setView('profile')">MG</button></div>`}
function syncStatus(){return `<span class="synchint"><i class="dot" style="background:${state.sync===2?'#3E9369':state.sync===1?'#E3A442':'#91AD9C'}"></i>${['Salvo neste aparelho','Pendente de sincronização','Sincronizado'][state.sync]}</span>`}
function hero(){return `<div class="hero"><div class="eyebrow">SEU PRÓXIMO PASSO</div><h2>Hoje é um bom dia para começar.</h2><p>Seu treino fica salvo mesmo quando a conexão cair.</p><button class="accentbtn" onclick="setView('active')">Iniciar minha sessão →</button></div>`}
function renderHome(){return `${topBar('Bom dia! 👋','Pequenos passos contam.')}<div>${syncStatus()}</div>${hero()}${h('Sua semana',['Ver agenda','calendar'])}<div class="daystrip">${[['S','20',0],['T','21',1],['Q','22',2],['Q','23',0],['S','24',0],['S','25',0],['D','26',0]].map(([d,n,x])=>`<div class="day ${x===2?'active':x===0?'rest':''}"><small>${d}</small>${n}</div>`).join('')}</div><div class="card"><div class="row"><div><div class="cardtitle">Seu progresso</div><div class="muted">2 de 3 sessões previstas nesta semana</div></div><span class="pill">67%</span></div><div class="progressrail"><i></i></div><div class="row sub"><span>Sem pressão. No seu ritmo.</span><span>2/3</span></div></div>${h('Acesso rápido',['Explorar','explore'])}<div class="card" style="padding:15px"><div class="exercise"><div class="thumb">↗</div><div style="flex:1"><div class="cardtitle">Montar meu treino</div><div class="muted">Escolha seus exercícios e salve uma rotina</div></div><button class="tinybtn" onclick="setView('builder')">Criar</button></div></div>`}
function renderWorkouts(){return `${topBar('Meus treinos','Tudo organizado para continuar.')}${syncStatus()}${h('Minha biblioteca',['Explorar','explore'])}<div class="card"><div class="row"><span class="pill">Criado por você</span><span class="sub">20 min</span></div><div class="sectionhead" style="margin-top:13px"><div><div class="cardtitle">Meu treino de casa</div><div class="muted">3 exercícios · Sem equipamento</div></div><span class="arrow">›</span></div><div class="buttonrow"><button class="secondarybtn" onclick="setView('builder')">Editar</button><button class="primary" onclick="setView('active')">Iniciar →</button></div></div><div class="card"><div class="row"><span class="pill">Plano cadastrado</span><span class="sub">Autoria: profissional</span></div><div class="cardtitle" style="margin-top:13px">Plano do meu treinador</div><div class="muted">Alterações manuais preservam a autoria e versões.</div></div>${h('Começar de outra forma')}<button class="primary block" onclick="setView('builder')">+ Criar treino do zero</button><button class="secondarybtn" style="width:100%;margin-top:10px" onclick="setView('explore')">Ver exercícios disponíveis</button><div class="statebox"><b>Modelos de demonstração em revisão</b><div>Não são planos profissionais recomendados. Monte seu treino ou registre um plano existente.</div></div>`}
const catalog=[['Agachamento com apoio','Sem equipamento','↕','forca'],['Remada com faixa elástica','Faixa longa','➜','banda'],['Mobilidade de ombros','Mobilidade','◌','mobilidade'],['Caminhada ao ar livre','Rua','↗','caminhada'],['Ponte de quadril','Casa','∩','forca'],['Caminhada lateral com mini band','Mini band','⇢','banda']];
function renderExplore(){return `${topBar('Explorar exercícios','Encontre opções para seu equipamento.')}<input class="search" placeholder="⌕  Buscar exercício" aria-label="Buscar exercício" oninput="filterSearch(this.value)"><div class="chips">${['Todos','Casa','Elásticos','Caminhada','Mobilidade'].map(x=>`<button class="${state.filter===x?'active':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div><div class="row" style="margin:8px 0 12px"><span class="eyebrow">CATÁLOGO DE EXEMPLO</span><span class="pill warn">Em revisão</span></div><div id="exerciseResults">${catalog.filter(x=>state.filter==='Todos'||(state.filter==='Casa'&&['forca'].includes(x[3]))||(state.filter==='Elásticos'&&x[3]==='banda')||(state.filter==='Caminhada'&&x[3]==='caminhada')||(state.filter==='Mobilidade'&&x[3]==='mobilidade')).map((x,i)=>`<div class="card exercise"><div class="thumb ${i%3===1?'blue':''}">${x[2]}</div><div style="flex:1"><div class="cardtitle">${x[0]}</div><div class="muted">${x[1]}</div></div><button class="tinybtn" onclick="setView('builder')">Adicionar</button></div>`).join('')}</div><div class="screenfoot">Descrições demonstrativas; técnica e adequação exigem revisão.</div>`}
function renderBuilder(){return `${topBar('Montar treino','Organize como preferir.')}<div class="card"><div class="eyebrow">NOME DO PLANO</div><input class="search" style="margin:8px 0 0" value="Meu treino de casa" aria-label="Nome do treino"/><div class="sectionhead" style="margin-bottom:0"><div><div class="cardtitle">Duração estimada</div><div class="muted">Exemplo ilustrativo</div></div><span class="pill">20 min</span></div></div>${h('Exercícios selecionados')}<div class="card">${[['01','Sentar e levantar','2 séries · meta ilustrativa: 8 repetições','45 s descanso'],['02','Flexão na parede','2 séries · meta ilustrativa: 8 repetições','45 s descanso'],['03','Mobilidade de ombros','1 sessão por tempo · 60 segundos','Sem pausa']].map(row=>`<div class="item"><div class="numtag">${row[0]}</div><div style="flex:1"><div class="cardtitle" style="font-size:14px">${row[1]}</div><div class="muted">${row[2]}</div><div class="sub">${row[3]}</div></div><button class="tinybtn" aria-label="Editar exercício">⋯</button></div>`).join('')}</div><button class="builderadd" style="width:100%" onclick="setView('explore')">+ Adicionar outro exercício</button><div class="statebox">Este é um editor visual de exemplo. No aplicativo real, séries, ordem e descanso serão editáveis e persistidos no Firestore.</div><button class="primary block" onclick="toast('Exemplo visual: o aplicativo real salvará no Firestore')">Salvar meu treino</button>`}
const figure=`<svg viewBox="0 0 160 160" fill="none" aria-hidden="true"><circle cx="83" cy="28" r="13" fill="#1C7563"/><path d="M77 44C64 59 64 81 72 95l-15 24M90 44c15 16 21 34 9 51l16 24" stroke="#1C7563" stroke-width="11" stroke-linecap="round"/><path d="M79 54 45 76M94 53l29 20" stroke="#1C7563" stroke-width="9" stroke-linecap="round"/><path d="M57 119l-8 22M115 119l7 23" stroke="#1C7563" stroke-width="9" stroke-linecap="round"/><rect x="31" y="76" width="99" height="5" rx="3" fill="#86BCA9"/></svg>`;
function renderActive(){return `${topBar('Sessão em andamento','Meu treino de casa · 20 min')}<div class="row"><span class="pill">Exercício 1 de 3</span><span class="pill warn">Modo foco</span></div><div class="illustration">${figure}</div><div class="card" style="text-align:center"><div class="eyebrow">MOVIMENTO ATUAL</div><h2 style="font-size:23px;margin:8px 0">Sentar e levantar</h2><div class="muted">Use apoio estável; consulte orientação técnica adequada.</div><div class="setcount">${state.completed+1}<span>/2</span></div><div class="sub">Série atual · Meta de exemplo: 8 repetições</div><div class="sets" style="justify-content:center"><span>Alvo planejado ≠ feito</span><span>Descanso: 45 s</span></div></div><button class="accentbtn block" style="min-height:64px;font-size:16px;background:#125F55;color:white;box-shadow:none" onclick="openConfirm()">Concluir série →</button><div class="buttonrow" style="margin-top:12px"><button class="secondarybtn" onclick="toast('Pausa ilustrativa: app real preservará seu estado')">Pausar</button><button class="secondarybtn" onclick="setView('workouts')">Sair e retomar depois</button></div><div class="screenfoot">Registre o resultado real somente depois da série.</div>`}
function renderCalendar(){return `${topBar('Agenda','Uma rotina que cabe na vida real.')}${h('Esta semana')}<div class="daystrip">${[['S','20',0],['T','21',0],['Q','22',2],['Q','23',0],['S','24',0],['S','25',0],['D','26',0]].map(([d,n,x])=>`<div class="day ${x===2?'active':''}"><small>${d}</small>${n}</div>`).join('')}</div><div class="card" style="margin-top:8px"><div class="row"><span class="pill">Hoje</span><span class="sub">22 out</span></div><div class="cardtitle" style="margin-top:12px">Treino em casa</div><div class="muted">Organizado por você · 20 minutos</div><div class="buttonrow" style="margin-top:15px"><button class="secondarybtn" onclick="toast('No app real, escolha outro dia')">Reagendar</button><button class="primary" onclick="setView('active')">Iniciar</button></div></div><div class="card"><div class="row"><div><div class="cardtitle">Amanhã: descanso completo</div><div class="muted">Descansar também faz parte do plano.</div></div><span style="font-size:25px">☼</span></div><button class="linkbtn" onclick="setView('rest')">Ver dia de descanso →</button></div><div class="card"><div class="cardtitle">Planejar próximo dia</div><p class="muted">Escolha treino, caminhada, mobilidade ou descanso. Nunca obrigatório diariamente.</p><button class="secondarybtn" onclick="toast('Fluxo de agendamento a implementar no Firestore')">+ Adicionar atividade</button></div>`}
function renderRest(){return `${topBar('Seu dia de recuperação','22 de outubro · Dia livre')}<div class="hero" style="background:linear-gradient(135deg,#276B64,#6CA486)"><div class="eyebrow">SEM OBRIGAÇÕES</div><h2>Descansar também é avançar.</h2><p>Você pode simplesmente descansar. A próxima sessão continua esperando por você.</p><button class="accentbtn" onclick="setView('calendar')">Ver próxima sessão →</button></div>${h('Se desejar')}<div class="card"><div class="cardtitle">Mobilidade ou caminhada leve</div><p class="muted">Somente quando apropriado e se fizer sentido para você. Não altera sua meta de descanso.</p><button class="secondarybtn" onclick="setView('explore')">Explorar opções</button></div><div class="card"><div class="cardtitle">Revisar sua semana</div><div class="muted">Ajuste compromissos com flexibilidade, sem zerar seu progresso.</div><button class="linkbtn" onclick="setView('calendar')">Organizar agenda →</button></div>`}
function renderProgress(){return `${topBar('Minha evolução','O que você fez, no seu ritmo.')}${h('Nesta semana')}<div class="metricgroup"><div class="metric"><div class="num">2/3</div><div class="lab">Sessões previstas</div></div><div class="metric"><div class="num">31 min</div><div class="lab">Tempo registrado</div></div><div class="metric"><div class="num">4</div><div class="lab">Séries concluídas</div></div></div><div class="card"><div class="cardtitle">Consistência semanal</div><div class="muted">Visão de exemplo, sem pontuar os dias de descanso</div><div class="bars">${[[42,'S'],[92,'T'],[72,'Q'],[116,'Q'],[61,'S'],[105,'S'],[28,'D']].map(([v,d],i)=>`<div style="text-align:center"><div class="bar ${i===3?'hi':''}" style="height:${v}px"></div><div class="sub" style="margin-top:7px">${d}</div></div>`).join('')}</div></div>${h('Histórico')}<div class="card"><div class="row"><div><div class="cardtitle">Treino em casa</div><div class="muted">20 de outubro · 18 minutos</div></div><span class="pill">Concluído</span></div></div><div class="card"><div class="row"><div><div class="cardtitle">Caminhada</div><div class="muted">18 de outubro · 13 minutos</div></div><span class="pill">Registrado</span></div></div><div class="screenfoot">Dados fictícios no protótipo. App real deriva de registros confirmados.</div>`}
function renderProfile(){return `${topBar('Meu perfil','Seus objetivos e configurações.')}<div class="card"><div class="row"><div class="avatar" style="width:59px;height:59px;font-size:18px">MG</div><div style="flex:1"><div class="cardtitle">Conta de demonstração</div><div class="muted">Google Auth real somente no aplicativo</div></div></div></div>${h('Preferências de treino')}<div class="card"><div class="item"><span>Objetivo principal</span><b style="margin-left:auto">Criar hábito</b></div><div class="item"><span>Equipamentos</span><b style="margin-left:auto">Mini band, faixa</b></div><div class="item"><span>Disponibilidade</span><b style="margin-left:auto">3 dias</b></div><button class="secondarybtn" style="margin-top:9px" onclick="toast('Editar perfil: implementação futura')">Editar preferências</button></div>${h('Armazenamento e privacidade')}<div class="card"><div class="item">${syncStatus()}</div><div class="item"><span>Exportar meus dados</span><button class="tinybtn" onclick="toast('Exportação real será implementada no aplicativo')">Exportar</button></div><div class="item"><span>Dispositivo confiável</span><span class="pill">A perguntar</span></div><div class="item"><span>Gerenciar conta e dados</span><span class="arrow">›</span></div></div>`}
function content(){switch(state.view){case 'workouts':return renderWorkouts();case 'explore':return renderExplore();case 'builder':return renderBuilder();case 'active':return renderActive();case 'calendar':return renderCalendar();case 'progress':return renderProgress();case 'profile':return renderProfile();case 'rest':return renderRest();default:return renderHome()}}
function render(){document.getElementById('app').innerHTML=`<div class="statusline"><span>9:41</span><span>▂▅▇  ●</span></div><main class="content ${state.view==='active'?'focus':''}">${content()}</main>${state.view==='active'?'':nav()}${state.modal?`<div class="sheetOverlay" role="dialog" aria-modal="true" aria-label="Confirmar repetições feitas"><div class="sheet"><div class="eyebrow">DEPOIS DA SÉRIE</div><h2>Quantas repetições você fez?</h2><p class="muted">Alvo previsto: 8. Informe o resultado real.</p><div class="stepper"><button onclick="changeReps(-1)" aria-label="Diminuir repetições">−</button><strong>${state.reps}</strong><button onclick="changeReps(1)" aria-label="Aumentar repetições">+</button></div><div class="buttonrow"><button class="secondarybtn" onclick="state.modal=false;render()">Cancelar</button><button class="primary" onclick="confirmReps()">Confirmar resultado</button></div><p class="caption">Protótipo: nada é gravado no Firebase nesta página.</p></div></div>`:''}`;document.getElementById('pages').innerHTML=views.map(([id,label])=>`<button class="${state.view===id?'sel':''}" onclick="setView('${id}')">${label}</button>`).join('');}
function setView(v){state.view=v;state.modal=false;try{history.replaceState({},'',location.pathname+'?view='+v)}catch(e){}render();document.getElementById('app').scrollTop=0}
function setFilter(x){state.filter=x;render()}
function filterSearch(s){const container=document.getElementById('exerciseResults');if(!container)return;for(const row of container.querySelectorAll('.card'))row.style.display=row.textContent.toLowerCase().includes(s.toLowerCase())?'flex':'none'}
function cycleSync(){state.sync=(state.sync+1)%3;render()}
function openConfirm(){state.modal=true;state.reps=8;render()}
function changeReps(n){state.reps=Math.max(0,Math.min(99,state.reps+n));render()}
function confirmReps(){state.modal=false;state.completed=(state.completed+1)%2;render();toast('Demonstração: resultado indicado foi '+state.reps+' repetições')}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.getElementById('app').appendChild(el);setTimeout(()=>el.remove(),3200)}
render();</script></body></html>
